# SonarCloud analysis settings (Part 3, Task 1). Read by the SonarCloudPrepare task.
# Paths are relative to the repository root.
sonar.projectKey=falling-cats_pest-monitoring
sonar.projectName=PestPatrol
sonar.sourceEncoding=UTF-8

# What to analyse
sonar.sources=pest-monitoring/backend,pest-monitoring/frontend/src
sonar.exclusions=**/migrations/**,pest-monitoring/backend/tests/**,**/*.spec.ts,\
  pest-monitoring/backend/staticfiles/**,pest-monitoring/backend/media/**
sonar.tests=pest-monitoring/backend/tests,pest-monitoring/frontend/src
sonar.test.inclusions=pest-monitoring/backend/tests/**/*.py,pest-monitoring/frontend/src/**/*.spec.ts

# Languages and coverage reports (made by pytest-cov and Karma in the test jobs)
sonar.python.version=3.12
sonar.python.coverage.reportPaths=pest-monitoring/backend/coverage.xml
sonar.javascript.lcov.reportPaths=pest-monitoring/frontend/coverage/lcov.info

# Same exclusions as the coverage gates in pyproject.toml / karma.conf.js
sonar.coverage.exclusions=**/migrations/**,**/admin.py,**/apps.py,pest-monitoring/backend/manage.py,\
  pest-monitoring/backend/config/wsgi.py,pest-monitoring/frontend/src/environments/**,pest-monitoring/frontend/src/main.ts
sonar.cpd.exclusions=**/migrations/**

# Fail the pipeline when the quality gate fails
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300