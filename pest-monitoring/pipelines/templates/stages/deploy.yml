# Release stage (Part 3, Task 2): deploy the exact commit CI just built and tested to Render,
# then smoke-test it. Runs only for main (never for pull requests), and only after someone
# approves it on the pest-prod environment (Pipelines -> Environments -> pest-prod).
#
#   1. Trigger the Render deploy hooks for the backend (Docker) and frontend (static site)
#   2. Smoke tests: the stage fails unless the new commit is the one answering
parameters:
- name: adoEnvironment         # Azure DevOps environment (approvals are set on it)
  type: string
- name: dependsOn
  type: object

stages:
- stage: Deploy
  displayName: Deploy to Render
  dependsOn: ${{ parameters.dependsOn }}
  condition: >-
    and(succeeded(),
        ne(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: Deploy
    displayName: Deploy PestPatrol
    environment: ${{ parameters.adoEnvironment }}
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none   # Render builds from Git itself, so no build artifacts are needed here

          # Deploy hooks are secret URLs, so they come in through env (secrets are never exposed automatically).
          # ref= makes Render deploy exactly the commit this pipeline tested, not whatever is newest on main.
          - bash: |
              set -e
              for hook in "$BACKEND_HOOK" "$FRONTEND_HOOK"; do
                case "$hook" in
                  ''|'$('*) echo "##vso[task.logissue type=error]renderBackendDeployHook / renderFrontendDeployHook pipeline variables are missing"; exit 1 ;;
                esac
              done
              curl -fsS -X POST "$BACKEND_HOOK&ref=$(Build.SourceVersion)"; echo
              curl -fsS -X POST "$FRONTEND_HOOK&ref=$(Build.SourceVersion)"; echo
            displayName: Trigger Render deploys for commit $(Build.SourceVersion)
            env:
              BACKEND_HOOK: $(renderBackendDeployHook)
              FRONTEND_HOOK: $(renderFrontendDeployHook)

          # The free plan builds the image from scratch, so allow up to 15 minutes
          - template: ../steps/smoke-test.yml
            parameters:
              name: backend is running this commit
              url: $(backendUrl)/healthz
              expectText: $(Build.SourceVersion)
              attempts: 60
              delaySeconds: 15
          - template: ../steps/smoke-test.yml
            parameters:
              name: API returns seeded species
              url: $(backendUrl)/api/species/
              expectText: common_name
              attempts: 5
              delaySeconds: 10
          - template: ../steps/smoke-test.yml
            parameters:
              name: frontend is served
              url: $(frontendUrl)/
              expectText: <app-root
              attempts: 40
              delaySeconds: 15
          - template: ../steps/smoke-test.yml
            parameters:
              name: frontend points at the backend
              url: $(frontendUrl)/env.js
              expectText: $(backendUrl)/api
              attempts: 5
              delaySeconds: 10
